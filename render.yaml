services:
  # ── Single Web Service: FastAPI serves React frontend + REST API ────────────
  - type: web
    name: pharmasafe
    runtime: python
    rootDir: .
    plan: free
    buildCommand: >
      cd frontend && npm install && npm run build && cd ..
      && pip install --upgrade pip
      && pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: NODE_VERSION
        value: "20"
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: pharmasafe-db
          property: connectionString

# ── PostgreSQL Database ─────────────────────────────────────────────────────
databases:
  - name: pharmasafe-db
    plan: free
    databaseName: pharmasafe
    user: pharmasafe_user
