name: pharmasafe_mobile
description: "PharmaSafe Intelligence — Live Medicine Tracking & Field Scanner"
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Networking
  dio: ^5.4.3+1

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.0

  # QR / barcode scanning
  mobile_scanner: ^5.1.1

  # Date formatting
  intl: ^0.19.0

  # Smooth animations
  flutter_animate: ^4.5.0

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
